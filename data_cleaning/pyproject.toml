[project]
name = "dataplor-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "geopandas>=1.2.0",
    "h3>=4.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "numpy>=1.24.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.0.0",
    "scikit-learn>=1.2.0",
    "unidecode>=1.3.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=9.2.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
